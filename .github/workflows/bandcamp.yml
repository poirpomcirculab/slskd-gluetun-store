name: image bandcamp
on:
  push:
    paths: ["images/bandcamp/**", ".github/workflows/bandcamp.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: images/bandcamp
          platforms: linux/amd64
          push: true
          tags: ghcr.io/poirpomcirculab/slskd-gluetun-bandcamp:1.0.1
