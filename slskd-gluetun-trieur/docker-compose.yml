version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: slskd-gluetun-trieur_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/poirpomcirculab/slskd-gluetun-trieur:1.0.5@sha256:af2a407cc86010ba042e778f9b3b90c66533ec61bf39574d6792b4e274339294
    init: true
    # root: Médias/Musique (copied by the Umbrel file API) is owned by root, 0755
    user: "0:0"
    environment:
      - MEDIAS=/medias
      - STATE=/data
    volumes:
      - ${APP_DATA_DIR}/data/etat:/data
      - ${UMBREL_ROOT}/data/storage/downloads/Médias:/medias
    restart: on-failure
