version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: slskd-gluetun-trieur_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/poirpomcirculab/slskd-gluetun-trieur:1.0.3@sha256:5573253448dadecf362f75b82b8fba79e2b6de631af6457a54fd6c7046e8eeb3
    init: true
    user: "1000:1000"
    environment:
      - MEDIAS=/dl
      - PARENT=1
      - STATE=/data
    volumes:
      - ${APP_DATA_DIR}/data/etat:/data
      - ${UMBREL_ROOT}/data/storage/downloads:/dl
    restart: on-failure
