version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: slskd-gluetun-trieur_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/poirpomcirculab/slskd-gluetun-trieur:1.0.1
    init: true
    user: "1000:1000"
    environment:
      - MEDIAS=/medias
      - STATE=/data
    volumes:
      - ${APP_DATA_DIR}/data/etat:/data
      - ${UMBREL_ROOT}/data/storage/downloads/Médias:/medias
    restart: on-failure
