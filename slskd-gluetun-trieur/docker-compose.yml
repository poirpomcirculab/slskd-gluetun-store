version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: slskd-gluetun-trieur_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/poirpomcirculab/slskd-gluetun-trieur:1.0.7@sha256:0f32b250b9d17027cf2e7a8b90d5c3e1f3392150b53231412329e99a53c5e11f
    init: true
    # root: Médias/Musique (copied by the Umbrel file API) is owned by root, 0755
    user: "0:0"
    environment:
      - MEDIAS=/medias
      - STATE=/data
    volumes:
      - ${APP_DATA_DIR}/data/etat:/data
      - ${UMBREL_ROOT}/data/storage/downloads/Médias:/medias
    restart: on-failure
