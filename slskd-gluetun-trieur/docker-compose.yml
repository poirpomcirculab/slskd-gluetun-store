version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: slskd-gluetun-trieur_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/poirpomcirculab/slskd-gluetun-trieur:1.1.1@sha256:025a9f684d533286e86dcf9896aedbe903cf2c7798326f15fb946e6f8a0a980b
    init: true
    # root: Médias/Musique (copied by the Umbrel file API) is owned by root, 0755
    user: "0:0"
    environment:
      - MEDIAS=/medias
      - STATE=/data
    volumes:
      - ${APP_DATA_DIR}/data/etat:/data
      - ${UMBREL_ROOT}/data/storage/downloads/Médias:/medias
    restart: on-failure
