id: slskd-gluetun-trieur
category: media
name: Trieur
version: "1.0.3"
tagline: Drop zone sorter for films, series and music
description: >-
  Watches the root of Médias/À trier and routes each item to Films, Séries or
  Musique, then processes music albums (unzip, MusicBrainz match, MP3 320,
  tags, cover, synced lyrics) into Médias/Musique. Status and events are read
  by n8n on port 8080 (internal).
